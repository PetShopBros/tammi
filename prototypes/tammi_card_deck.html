<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>tammi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eeeaf6;
    --ink: #241c35;
    --plum: #4b3869;
    --mustard: #e2963c;
    --coral: #e1566b;
    --muted: #8b84a0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    padding: 28px 16px 60px;
    display:flex;
    justify-content:center;
  }
  .wrap{ width:100%; max-width: 420px; }

  header{
    text-align:center;
    margin-bottom: 18px;
  }
  header h1{
    font-family:'Space Grotesk','Noto Sans KR', sans-serif;
    font-weight:700;
    font-size: 26px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header p{
    margin:0;
    font-size: 13px;
    color: var(--muted);
  }
  .counter{
    text-align:center;
    font-family:'Space Grotesk', sans-serif;
    font-size: 12px;
    color: var(--plum);
    font-weight:500;
    margin: 14px 0 20px;
    letter-spacing: 0.04em;
  }
  .counter b{ font-size:15px; }

  /* Duel card */
  .duel{
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(36,28,53,0.25);
  }
  .opt{
    padding: 38px 24px;
    cursor:pointer;
    user-select:none;
    text-align:center;
    transition: transform .12s ease, filter .12s ease;
  }
  .opt:active{ transform: scale(0.97); }
  .opt.top{
    background: var(--plum);
    color: #f4f0ff;
    border-radius: 20px 20px 0 0;
  }
  .opt.bottom{
    background: var(--mustard);
    color: #2b1c05;
    border-radius: 0 0 20px 20px;
  }
  .opt .label{
    font-family:'Space Grotesk', sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.65;
    margin-bottom: 10px;
  }
  .opt .text{
    font-size: 19px;
    font-weight: 700;
    line-height: 1.4;
  }
  .vs-badge{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    width: 46px; height:46px;
    background: var(--coral);
    color:#fff;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 13px;
    box-shadow: 0 4px 12px rgba(225,86,107,0.5);
    z-index: 5;
    pointer-events:none;
  }

  @media (prefers-reduced-motion: no-preference){
    .duel.flying-top .opt.top{ transform: translateY(-40px); opacity:0; }
    .duel.flying-top .opt.bottom{ transform: translateY(-40px); opacity:0; }
    .duel.flying-bottom .opt.top{ transform: translateY(40px); opacity:0; }
    .duel.flying-bottom .opt.bottom{ transform: translateY(40px); opacity:0; }
    .duel .opt{ transition: transform .22s ease, opacity .22s ease; }
    .duel.enter .opt{ animation: popIn .25s ease; }
    @keyframes popIn{ from{opacity:0; transform: scale(0.96);} to{opacity:1; transform:none;} }
  }

  .skip-row{
    text-align:center;
    margin-top: 14px;
  }
  .skip-row button{
    background:none;
    border:none;
    font-family:'Noto Sans KR', sans-serif;
    font-size: 12.5px;
    color: var(--muted);
    text-decoration: underline;
    cursor:pointer;
  }

  /* Profile toggle + panel */
  .profile-toggle{
    display:block;
    width:100%;
    margin-top: 26px;
    background: #fff;
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size: 14px;
    color: var(--plum);
    cursor:pointer;
    box-shadow: 0 4px 14px rgba(36,28,53,0.08);
  }
  .profile-panel{
    display:none;
    background:#fff;
    border-radius: 14px;
    margin-top: 10px;
    padding: 20px 20px 6px;
    box-shadow: 0 4px 14px rgba(36,28,53,0.08);
  }
  .profile-panel.open{ display:block; }
  .profile-empty{
    font-size: 13px;
    color: var(--muted);
    padding-bottom: 16px;
    line-height:1.6;
  }
  .axis{
    margin-bottom: 18px;
  }
  .axis .poles{
    display:flex;
    justify-content:space-between;
    font-size: 12px;
    font-weight:700;
    margin-bottom: 6px;
  }
  .axis .poles span:first-child{ color: var(--plum); }
  .axis .poles span:last-child{ color: var(--mustard); }
  .axis .bar{
    height: 8px;
    border-radius: 4px;
    background: #efe9dd;
    overflow:hidden;
    display:flex;
  }
  .axis .bar .fillL{ background: var(--plum); height:100%; }
  .axis .bar .fillR{ background: var(--mustard); height:100%; }

  .badge-line{
    text-align:center;
    font-size: 14px;
    font-weight: 700;
    color: var(--coral);
    padding: 4px 0 18px;
  }

  .compare-toggle{
    display:block;
    width:100%;
    margin-top: 10px;
    background: #fff;
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size: 14px;
    color: var(--coral);
    cursor:pointer;
    box-shadow: 0 4px 14px rgba(36,28,53,0.08);
  }
  .compare-panel{
    display:none;
    background:#fff;
    border-radius: 14px;
    margin-top: 10px;
    padding: 18px 20px 20px;
    box-shadow: 0 4px 14px rgba(36,28,53,0.08);
  }
  .compare-panel.open{ display:block; }
  .compare-note{
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .compare-section{ margin-bottom: 20px; }
  .compare-section h4{
    font-size: 13px;
    font-weight:700;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .code-row{ display:flex; gap:8px; }
  .code-row input{
    flex:1;
    border: 1.5px solid #e7e2f2;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family:'Space Grotesk', sans-serif;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .code-row button{
    background: var(--plum);
    color: #fff;
    border:none;
    border-radius: 8px;
    padding: 0 16px;
    font-weight:700;
    font-size: 13px;
    cursor:pointer;
    white-space: nowrap;
  }
  .my-code-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--bg);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 8px;
  }
  .my-code-box span{
    font-family:'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight:700;
    letter-spacing: 0.1em;
    color: var(--plum);
  }
  .my-code-box button{
    background:none;
    border: 1px solid var(--plum);
    color: var(--plum);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor:pointer;
  }
  .compare-msg{
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }
  .cmp-axis{ margin-bottom: 16px; }
  .cmp-axis .cmp-poles{
    display:flex; justify-content:space-between;
    font-size: 11.5px; font-weight:700; margin-bottom:4px;
  }
  .cmp-axis .cmp-poles span:first-child{ color: var(--plum); }
  .cmp-axis .cmp-poles span:last-child{ color: var(--mustard); }
  .cmp-bar{
    height:7px; border-radius:4px; background:#efe9dd;
    overflow:hidden; display:flex; margin-bottom:3px;
  }
  .cmp-bar .fL{ background: var(--plum); height:100%; }
  .cmp-bar .fR{ background: var(--mustard); height:100%; }
  .cmp-bar.friend .fL{ background: #a99bd4; }
  .cmp-bar.friend .fR{ background: #f0c184; }
  .cmp-who{ font-size:10.5px; color: var(--muted); margin-bottom:2px; }
  .cmp-result{
    text-align:center;
    font-size: 14px;
    font-weight:700;
    color: var(--coral);
    padding-top: 6px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>tammi</h1>
    <p>매일 조금씩, 나를 탐구하다</p>
  </header>

  <div class="counter">총 <b id="totalCount">0</b>번 선택함</div>

  <div class="duel enter" id="duel">
    <div class="opt top" id="optTop">
      <div class="label">A</div>
      <div class="text" id="textTop">불러오는 중…</div>
    </div>
    <div class="opt bottom" id="optBottom">
      <div class="label">B</div>
      <div class="text" id="textBottom">불러오는 중…</div>
    </div>
    <div class="vs-badge">VS</div>
  </div>

  <div class="skip-row"><button id="skipBtn">패스하고 다음 카드</button></div>

  <a class="profile-toggle" id="resultLink" href="/result" style="display:block; text-align:center; text-decoration:none;">내 결과 보기 →</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ---- Supabase 연결 설정 ----
const SUPABASE_URL = 'https://dmrokelruhncgewmshay.supabase.co';
const SUPABASE_KEY = 'sb_publishable_r00_v7TZXpQfBcwqf48N4g_LcnxU8NY';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function getUserId(){
  let id = localStorage.getItem('tammi_anon_user_id');
  if(!id){
    id = crypto.randomUUID();
    localStorage.setItem('tammi_anon_user_id', id);
  }
  return id;
}
const USER_ID = getUserId();

const BIGFIVE_AXIS_MAP = {
  bigfive_openness: 'stability',
  bigfive_conscientiousness: 'plan',
  bigfive_extraversion: 'social',
  bigfive_agreeableness: 'mind',
  bigfive_stability: 'mood',
};

const FALLBACK_PAIRS = [
  {axis:'stability', top:{pole:'stable', text:'평생 한 동네에서 살기'}, bottom:{pole:'adventure', text:'매년 새로운 도시로 이사하기'}},
  {axis:'stability', top:{pole:'stable', text:'안정적인 월급 받기'}, bottom:{pole:'adventure', text:'대박 아니면 쪽박, 창업하기'}},
  {axis:'stability', top:{pole:'stable', text:'늘 가던 맛집 가기'}, bottom:{pole:'adventure', text:'처음 보는 음식 도전하기'}},
  {axis:'stability', top:{pole:'stable', text:'짜여진 여행 일정'}, bottom:{pole:'adventure', text:'즉흥적으로 떠나는 여행'}},
  {axis:'stability', top:{pole:'stable', text:'매일 같은 루틴'}, bottom:{pole:'adventure', text:'매일 다른 하루'}},
  {axis:'stability', top:{pole:'stable', text:'안전한 선택'}, bottom:{pole:'adventure', text:'짜릿한 도전'}},
  {axis:'stability', top:{pole:'stable', text:'예측 가능한 하루'}, bottom:{pole:'adventure', text:'무슨 일이 생길지 모르는 하루'}},

  {axis:'mind', top:{pole:'logic', text:'데이터로 설득하기'}, bottom:{pole:'emotion', text:'마음으로 공감하기'}},
  {axis:'mind', top:{pole:'logic', text:'논리적인 대화'}, bottom:{pole:'emotion', text:'감성적인 대화'}},
  {axis:'mind', top:{pole:'logic', text:'머리로 결정하기'}, bottom:{pole:'emotion', text:'마음이 이끄는 대로'}},
  {axis:'mind', top:{pole:'logic', text:'분석하며 보는 영화'}, bottom:{pole:'emotion', text:'펑펑 울게 되는 영화'}},
  {axis:'mind', top:{pole:'logic', text:'효율을 중시함'}, bottom:{pole:'emotion', text:'분위기를 중시함'}},
  {axis:'mind', top:{pole:'logic', text:'조목조목 설명하기'}, bottom:{pole:'emotion', text:'그냥 느끼는 대로 표현하기'}},
  {axis:'mind', top:{pole:'logic', text:'팩트 위주로 말하기'}, bottom:{pole:'emotion', text:'뉘앙스 위주로 말하기'}},

  {axis:'plan', top:{pole:'planner', text:'여행은 계획표부터 짜기'}, bottom:{pole:'spontaneous', text:'일단 떠나고 보기'}},
  {axis:'plan', top:{pole:'planner', text:'할 일 목록 작성하기'}, bottom:{pole:'spontaneous', text:'생각나는 대로 행동하기'}},
  {axis:'plan', top:{pole:'planner', text:'약속은 미리 정하기'}, bottom:{pole:'spontaneous', text:'즉흥 만남 좋아하기'}},
  {axis:'plan', top:{pole:'planner', text:'예산 짜서 소비하기'}, bottom:{pole:'spontaneous', text:'끌리는 대로 소비하기'}},
  {axis:'plan', top:{pole:'planner', text:'식단 미리 짜두기'}, bottom:{pole:'spontaneous', text:'그날 끌리는 거 먹기'}},
  {axis:'plan', top:{pole:'planner', text:'정해진 루틴 지키기'}, bottom:{pole:'spontaneous', text:'그때그때 다르게 하기'}},
  {axis:'plan', top:{pole:'planner', text:'미리 준비해두는 성격'}, bottom:{pole:'spontaneous', text:'닥치면 하는 성격'}},

  {axis:'social', top:{pole:'relationship', text:'친구들과 왁자지껄'}, bottom:{pole:'independence', text:'혼자만의 시간'}},
  {axis:'social', top:{pole:'relationship', text:'다같이 정하기'}, bottom:{pole:'independence', text:'혼자 정하기'}},
  {axis:'social', top:{pole:'relationship', text:'무리 안에서 함께'}, bottom:{pole:'independence', text:'내 갈 길 가기'}},
  {axis:'social', top:{pole:'relationship', text:'고민을 나누기'}, bottom:{pole:'independence', text:'혼자 해결하기'}},
  {axis:'social', top:{pole:'relationship', text:'함께하는 취미'}, bottom:{pole:'independence', text:'혼자 하는 취미'}},
  {axis:'social', top:{pole:'relationship', text:'다수 의견 따르기'}, bottom:{pole:'independence', text:'내 소신대로 하기'}},
  {axis:'social', top:{pole:'relationship', text:'연락 자주 하는 편'}, bottom:{pole:'independence', text:'연락 뜸해도 괜찮은 편'}}
];

async function fetchQuestionsFromDB(){
  const { data: questions, error: qErr } = await db
    .from('questions')
    .select('id, options')
    .eq('format_type', 'ab_dual')
    .limit(300);
  if(qErr || !questions || questions.length === 0){
    console.warn('DB 문항 조회 실패, 로컬 fallback 사용', qErr);
    return null;
  }

  const questionIds = questions.map(q => q.id);
  const { data: links, error: lErr } = await db
    .from('question_trait_links')
    .select('question_id, option_key, pole, weight, traits(key, family)')
    .in('question_id', questionIds);
  if(lErr || !links){
    console.warn('trait 연결 조회 실패, 로컬 fallback 사용', lErr);
    return null;
  }

  // 옵션 하나에 여러 특성이 걸려있을 수 있으므로, weight가 가장 높은(주 특성) 링크를 대표로 삼는다
  const primaryLinkByQuestionOption = {};
  links.forEach(l => {
    const key = `${l.question_id}:${l.option_key}`;
    const existing = primaryLinkByQuestionOption[key];
    if(!existing || l.weight > existing.weight){
      primaryLinkByQuestionOption[key] = {
        pole: l.pole,
        weight: l.weight,
        isBigFive: l.traits?.family === 'BigFive',
        axis: l.traits?.family === 'BigFive' ? BIGFIVE_AXIS_MAP[l.traits.key] : null,
      };
    }
  });

  const deckItems = [];
  questions.forEach(q => {
    const linkA = primaryLinkByQuestionOption[`${q.id}:a`];
    const linkB = primaryLinkByQuestionOption[`${q.id}:b`];
    const optA = q.options.find(o => o.key === 'a');
    const optB = q.options.find(o => o.key === 'b');
    if(!linkA || !linkB || !optA || !optB) return;
    deckItems.push({
      questionId: q.id,
      axis: linkA.axis,
      top: {pole: linkA.isBigFive ? linkA.pole : null, text: optA.text, optionKey: 'a'},
      bottom: {pole: linkB.isBigFive ? linkB.pole : null, text: optB.text, optionKey: 'b'},
    });
  });

  return deckItems.length > 0 ? deckItems : null;
}

async function saveResponseToDB(questionId, optionKey){
  if(!questionId) return;
  try{
    await db.from('responses').insert({
      user_id: USER_ID,
      question_id: questionId,
      chosen_option: optionKey,
    });
  }catch(e){
    console.warn('응답 저장 실패 (네트워크 문제일 수 있음)', e);
  }
}

const AXES = [
  {key:'stability', left:'stable', right:'adventure', leftLabel:'안정형', rightLabel:'모험형'},
  {key:'mind', left:'logic', right:'emotion', leftLabel:'이성형', rightLabel:'감성형'},
  {key:'plan', left:'planner', right:'spontaneous', leftLabel:'계획형', rightLabel:'즉흥형'},
  {key:'social', left:'relationship', right:'independence', leftLabel:'관계형', rightLabel:'독립형'},
  {key:'mood', left:'steady', right:'reactive', leftLabel:'차분형', rightLabel:'예민형'}
];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

let sourcePairs = FALLBACK_PAIRS;
let deck = shuffle(sourcePairs);
let deckPtr = 0;
let current = null;
let tallies = {};
AXES.forEach(a=>{ tallies[a.left]=0; tallies[a.right]=0; });
tallies.total = 0;

const textTop = document.getElementById('textTop');
const textBottom = document.getElementById('textBottom');
const optTop = document.getElementById('optTop');
const optBottom = document.getElementById('optBottom');
const duel = document.getElementById('duel');
const totalCount = document.getElementById('totalCount');
const skipBtn = document.getElementById('skipBtn');

function nextCard(){
  if(deckPtr >= deck.length){
    deck = shuffle(sourcePairs);
    deckPtr = 0;
  }
  current = deck[deckPtr++];
  textTop.textContent = current.top.text;
  textBottom.textContent = current.bottom.text;
}

async function loadTallies(){
  try{
    const saved = localStorage.getItem('tammi_profile_tallies');
    if(saved){
      tallies = Object.assign(tallies, JSON.parse(saved));
    }
  }catch(e){ /* no saved data yet */ }

  const dbPairs = await fetchQuestionsFromDB();
  if(dbPairs){
    sourcePairs = dbPairs;
  }
  deck = shuffle(sourcePairs);
  deckPtr = 0;

  renderProfile();
  nextCard();
  duel.classList.remove('enter');
  void duel.offsetWidth;
  duel.classList.add('enter');
}

async function saveTallies(){
  try{
    localStorage.setItem('tammi_profile_tallies', JSON.stringify(tallies));
  }catch(e){ console.error('save failed', e); }
}

// 상단 "총 N번 선택함" 카운터만 갱신. 별자리/축 그래프/친구비교는
// tammi_result_blob.html(실제 DB 기반 결과화면)로 이동했음.
function renderProfile(){
  totalCount.textContent = tallies.total;
}

function choose(pole, direction, questionId, optionKey){
  if(pole){
    tallies[pole] = (tallies[pole]||0) + 1;
  }
  tallies.total += 1;
  saveTallies();
  saveResponseToDB(questionId, optionKey);
  renderProfile();

  duel.classList.add(direction === 'top' ? 'flying-top' : 'flying-bottom');
  setTimeout(()=>{
    nextCard();
    duel.classList.remove('flying-top','flying-bottom');
    duel.classList.remove('enter');
    void duel.offsetWidth;
    duel.classList.add('enter');
  }, 180);
}

optTop.addEventListener('click', ()=> choose(current.top.pole, 'top', current.questionId, current.top.optionKey));
optBottom.addEventListener('click', ()=> choose(current.bottom.pole, 'bottom', current.questionId, current.bottom.optionKey));
skipBtn.addEventListener('click', ()=>{
  nextCard();
  duel.classList.remove('enter');
  void duel.offsetWidth;
  duel.classList.add('enter');
});

loadTallies();
</script>
</body>
</html>
